<!doctype html>
<html lang="en">
<head>
    <meta name="color-scheme" content="light">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Supplier Inbox</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="desktop">
    <div class="window">
      <header class="titlebar">
        <div class="lights" aria-hidden="true"><i></i><i></i><i></i></div>
        <div class="title">
          <span class="app-icon mail" aria-hidden="true"><img src="/media/nav-inbox.jpg" alt="" loading="lazy"></span>
          Inbox <span class="sub" id="mailbox"></span>
        </div>
        <div class="toolbar">
          <span class="pill info">Demo emails</span>
          <a class="btn" href="/" target="larder-app">Back to LarderCheck</a>
        </div>
      </header>
      <div class="mail-layout">
        <nav class="sidebar" aria-label="Mailboxes">
          <div class="side-head">Mailboxes</div>
          <div id="boxes"></div>
        </nav>
        <ul class="mail-list" id="list" aria-label="Emails"></ul>
        <article class="mail-view" id="view" aria-live="polite"></article>
      </div>
    </div>
  </div>
  <script src="common.js"></script>
  <script src="inbox.js"></script>
</body>
</html>
