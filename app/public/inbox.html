<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Supplier Inbox</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">✉</div>
        <div>
          <h1>Supplier inbox</h1>
          <p id="mailbox">Fictional order emails</p>
        </div>
      </div>
      <div class="top-actions">
        <span class="pill info">Demo mailbox: all emails are made up</span>
        <a class="btn" href="/" target="larder-app">Back to LarderCheck</a>
      </div>
    </header>
    <div class="mail">
      <ul class="mail-list" id="list" aria-label="Emails"></ul>
      <article class="mail-view" id="view" aria-live="polite"></article>
    </div>
  </div>
  <script src="common.js"></script>
  <script src="inbox.js"></script>
</body>
</html>
